  <text x="88" y="600" fill="#8A8AA0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" letter-spacing="1.5">10 MOTION BLOCKS   ·   11 QA METRICS   ·   5 REFERENCE FILMS   ·   MIT</text>
